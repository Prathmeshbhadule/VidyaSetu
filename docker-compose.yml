version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vidyasetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidyasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidyasetu_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vidyasetu}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidyasetu} -d ${POSTGRES_DB:-vidyasetu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vidyasetu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: vidyasetu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vidyasetu-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vidyasetu}:${POSTGRES_PASSWORD:-vidyasetu_secure_pass}@postgres:5432/${POSTGRES_DB:-vidyasetu}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secure-production-jwt-secret-minimum-32-chars!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secure-refresh-jwt-secret-minimum-32-chars!}
      DEVICE_HMAC_SECRET: ${DEVICE_HMAC_SECRET:-super-secure-device-hmac-secret-minimum-32-chars!}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_key}
      S3_BUCKET: vidyasetu-media
      CORS_ORIGIN: "http://localhost:3000,http://localhost:8080"
    ports:
      - "4000:4000"

  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    container_name: vidyasetu-hub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SQLITE_PATH: /data/hub.sqlite
      CLOUD_SYNC_URL: http://api:4000/api/v1/sync
      SCHOOL_ID: "018f679a-1111-7000-8000-000000000001"
      DEVICE_TOKEN: "hub-device-master-token-abc123"
      DEVICE_HMAC_SECRET: ${DEVICE_HMAC_SECRET:-super-secure-device-hmac-secret-minimum-32-chars!}
    ports:
      - "3001:3001"
    volumes:
      - hubdata:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vidyasetu-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
      - hub

volumes:
  pgdata:
  redisdata:
  miniodata:
  hubdata:
